# Kéo Shopee -> Supabase -> build -> deploy, chạy trên máy của GitHub.
#
# Vì sao chuyển lên đây: trước đó job chạy bằng launchd trên MacBook. Máy ngủ là
# mất lượt (06:00 ngày 08/09/2026 trượt, launchd bắn bù lúc 09:48 khi Wi-Fi chưa
# lên nên chết luôn), và job chỉ ghi JSON ở máy đó chứ không deploy, nên link
# public đứng ở bản cũ dù job vẫn chạy.
#
# CHỈ dùng trigger schedule + workflow_dispatch. TUYỆT ĐỐI không thêm
# pull_request: repo này public, PR từ fork mà chạy được workflow là đọc được
# secret partner_key của Shopee.
name: ETL Shopee + deploy app

on:
  schedule:
    # GitHub chạy theo UTC. Giờ VN = UTC+7.
    - cron: '0 23 * * *'   # 06:00 giờ VN (hôm sau)
    - cron: '0 5 * * *'    # 12:00 giờ VN
    - cron: '0 13 * * *'   # 20:00 giờ VN
  workflow_dispatch:        # bấm tay khi cần chạy bù

permissions:
  contents: write           # để đẩy bản build lên nhánh gh-pages

# Hai lượt chạy chồng nhau là hỏng token: cùng refresh thì Shopee vô hiệu hoá
# refresh_token của lượt kia. Xếp hàng, không huỷ lượt đang chạy.
concurrency:
  group: etl-shopee
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60           # infra.json có mục lịch sử commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "psycopg[binary]"

      - name: Kéo dữ liệu Shopee về Supabase và kết xuất JSON
        env:
          SUPABASE_DSN:        ${{ secrets.SUPABASE_DSN }}
          SHOPEE_PARTNER_ID:   ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY:  ${{ secrets.SHOPEE_PARTNER_KEY }}
          SHOPEE_SHOP_ID:      ${{ secrets.SHOPEE_SHOP_ID }}
        run: python -u scripts/shopee/run_all.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build bản tĩnh
        run: PAGES_BASE="/${{ github.event.repository.name }}/" npm run build

      - name: Đẩy lên nhánh gh-pages
        run: |
          set -euo pipefail
          touch dist/.nojekyll          # GitHub Pages bỏ qua file bắt đầu bằng _
          cd dist
          git init -q
          git checkout -qb gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Deploy $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M') (giờ VN)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

      - name: Nhật ký chạy
        if: always()
        run: tail -60 logs/etl.log || true
